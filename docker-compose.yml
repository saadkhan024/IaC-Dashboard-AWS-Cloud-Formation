version: '3.8'

services:
  iac-dashboard:
    build: .
    container_name: aws-iac-dashboard
    ports:
      - "5000:5000"
    environment:
      - DEMO_MODE=False                                    # ← Changed to False
      - AWS_ACCESS_KEY_ID=YOUR_ACCESS_KEY             # ← Add your key
      - AWS_SECRET_ACCESS_KEY=YOUR_SECRET_KEY         # ← Add your secret
      - AWS_DEFAULT_REGION=us-east-1                      # ← Add region
      - FLASK_ENV=development
    volumes:
      - ./app.py:/app/app.py
      - ./static:/app/static
    restart: unless-stopped
    networks:
      - iac-network

networks:
  iac-network:
    driver: bridge
